name: Ubuntu GTK

on: 
  - push
  - pull_request

jobs:
  build_by_cmake:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-20.04
    steps:
    - name: Downloading Source Code 📥
      uses: actions/checkout@v2
    - name: Downloading dependencies 📥
      run: sudo apt-get install build-essential cmake libgtksourceviewmm-3.0-dev libgtkmm-3.0-dev libtinyxml2-dev
    - name: Configure 🔧
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
    - name: Compile 🎲
      run: cmake --build build --parallel
