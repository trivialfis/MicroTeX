name: Ubuntu GTK

on: 
  - push
  - pull_request

jobs:
  build_by_cmake:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-24.04
    steps:
    - name: Downloading Source Code 📥
      uses: actions/checkout@v4
    - name: Downloading dependencies 📥
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake libgtkmm-4.0-dev libfontconfig1-dev libtinyxml2-dev
    - name: Configure 🔧
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
    - name: Compile 🎲
      run: cmake --build build --parallel
    - name: Check headless SVG rendering
      run: |
        env -u DISPLAY -u WAYLAND_DISPLAY ./build/LaTeX -headless '-input=\frac{1}{2}+\sqrt{x}' -output=build/smoke.svg
        test -s build/smoke.svg
